name: Human Approval Workflow Tests

on:
  pull_request:
    paths:
      - "backend/security_layer/human_approval/**"
      - "backend/security_layer/tests/test_human_approval_workflow.py"
      - "docs/security/evidence/bundle_e_human_approval_workflow_proof.md"
      - ".github/workflows/human-approval-workflow-tests.yml"
  workflow_dispatch:

jobs:
  human-approval-workflow-tests:
    name: Isolated human approval workflow proof tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: |
          python -m pip install --upgrade pip
          # Minimal dependency for isolated Bundle E tests only.
          # Passing tests do NOT prove production readiness, enterprise readiness,
          # live agent enforcement, live blocking, or live approval workflow integration.
          python -m pip install pytest

      - name: Capture environment metadata
        run: |
          mkdir -p human-approval-workflow-artifacts
          {
            echo "claim_boundary=isolated human approval workflow proof only"
            echo "production_readiness=NO-GO"
            echo "enterprise_readiness=NO-GO"
            echo "live_enforcement_claimed=false"
            echo "python_version=$(python --version)"
            echo "pytest_version=$(python -m pytest --version)"
            echo "test_command=PYTHONPATH=. python -m pytest backend/security_layer/tests/test_human_approval_workflow.py -q"
          } > human-approval-workflow-artifacts/environment_metadata.txt

      - name: Run focused human approval workflow tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest backend/security_layer/tests/test_human_approval_workflow.py -q \
            2>&1 | tee human-approval-workflow-artifacts/test.log

      - name: Upload human approval workflow evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-approval-workflow-test-evidence
          path: human-approval-workflow-artifacts/
