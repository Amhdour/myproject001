name: Retrieval ACL Search Pipeline Gate Tests

on:
  pull_request:
    paths:
      - "backend/security_layer/retrieval_acl/**"
      - "backend/security_layer/tests/test_retrieval_acl_search_pipeline_gate.py"
      - "docs/security/evidence/bundle_b_retrieval_acl_search_pipeline_gate.md"
      - ".github/workflows/retrieval-acl-search-pipeline-gate-tests.yml"
  workflow_dispatch:

jobs:
  retrieval-acl-search-pipeline-gate-tests:
    name: Isolated retrieval ACL search-pipeline gate proof tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: |
          python -m pip install --upgrade pip
          # Minimal dependency for isolated Bundle B tests only.
          # Passing tests do NOT prove production readiness, enterprise readiness,
          # live Onyx retrieval enforcement, live blocking, or live filtering.
          python -m pip install pytest

      - name: Capture environment metadata
        run: |
          mkdir -p retrieval-acl-search-pipeline-gate-artifacts
          {
            echo "claim_boundary=isolated search-pipeline gate proof only"
            echo "production_readiness=NO-GO"
            echo "enterprise_readiness=NO-GO"
            echo "live_integration_claimed=false"
            echo "python_version=$(python --version)"
            echo "pytest_version=$(python -m pytest --version)"
            echo "test_command=PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_search_pipeline_gate.py -q"
          } > retrieval-acl-search-pipeline-gate-artifacts/environment_metadata.txt

      - name: Run focused retrieval ACL search-pipeline gate tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_search_pipeline_gate.py -q \
            2>&1 | tee retrieval-acl-search-pipeline-gate-artifacts/test.log

      - name: Upload retrieval ACL search-pipeline gate evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-acl-search-pipeline-gate-test-evidence
          path: retrieval-acl-search-pipeline-gate-artifacts/
