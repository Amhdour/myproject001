name: Retrieved Content Prompt Injection Security

on:
  pull_request:
    paths:
      - "backend/security_layer/retrieval/prompt_injection/**"
      - "backend/security_layer/tests/test_retrieved_content_prompt_injection.py"
      - "backend/onyx/context/search/retrieval/search_runner.py"
      - "demo_attacks/**"
      - "docs/security/**"
      - "scripts/security/validate_security_evidence.py"
      - ".github/workflows/retrieved-content-prompt-injection-security.yml"
  workflow_dispatch:

jobs:
  retrieved-content-prompt-injection-security:
    name: Focused retrieved-content prompt-injection proof checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run focused security and demo-runner tests
        run: |
          # Passing tests do NOT prove production readiness, enterprise readiness,
          # full prompt-injection defense, live blocking, live filtering,
          # staging validation, external validation, or compliance certification.
          PYTHONPATH=. pytest \
            backend/security_layer/tests/test_retrieved_content_prompt_injection.py \
            backend/security_layer/tests/test_demo_attack_runner.py \
            -q

      - name: Run synthetic demo attacks
        run: python demo_attacks/run_demo_attacks.py

      - name: Validate evidence files
        run: python scripts/security/validate_security_evidence.py

      - name: Validate claim boundaries
        run: |
          python scripts/portfolio/check_claim_boundary.py
          python scripts/portfolio/check_no_fake_claims.py
          python scripts/portfolio/check_evidence_links.py
