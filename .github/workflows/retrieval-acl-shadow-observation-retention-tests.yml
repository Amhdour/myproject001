name: Retrieval ACL Shadow Observation Retention Policy Tests

on:
  pull_request:
    paths:
      - "backend/security_layer/retrieval_acl/shadow_observation_retention.py"
      - "backend/security_layer/retrieval_acl/shadow_observation_audit.py"
      - "backend/security_layer/tests/test_retrieval_acl_shadow_observation_retention.py"
      - "backend/security_layer/tests/test_retrieval_acl_shadow_observation_audit.py"
      - "docs/security/evidence/bundle_o_shadow_observation_retention_policy.md"
      - ".github/workflows/retrieval-acl-shadow-observation-retention-tests.yml"
  workflow_dispatch:

jobs:
  retrieval-acl-shadow-observation-retention-tests:
    name: Shadow observation retention policy proof tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Capture environment metadata
        run: |
          mkdir -p retrieval-acl-shadow-observation-retention-artifacts
          {
            echo "claim_boundary=shadow observation retention policy proof only"
            echo "production_readiness=NO-GO"
            echo "enterprise_readiness=NO-GO"
            echo "live_enforcement_claimed=false"
            echo "live_filtering_claimed=false"
            echo "live_blocking_claimed=false"
            echo "redacted=true"
            echo "contains_document_content=false"
            echo "contains_document_ids=false"
            echo "contains_user_prompt=false"
            echo "python_version=$(python --version)"
            echo "pytest_version=$(python -m pytest --version)"
            echo "test_command=PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_shadow_observation_retention.py backend/security_layer/tests/test_retrieval_acl_shadow_observation_audit.py -q"
          } > retrieval-acl-shadow-observation-retention-artifacts/environment_metadata.txt

      - name: Run focused retrieval ACL shadow observation retention tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest \
            backend/security_layer/tests/test_retrieval_acl_shadow_observation_retention.py \
            backend/security_layer/tests/test_retrieval_acl_shadow_observation_audit.py \
            -q 2>&1 | tee retrieval-acl-shadow-observation-retention-artifacts/test.log

      - name: Upload retrieval ACL shadow observation retention evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-acl-shadow-observation-retention-test-evidence
          path: retrieval-acl-shadow-observation-retention-artifacts/
