name: Retrieval ACL Real-Path Shadow Observation Tests

on:
  pull_request:
    paths:
      - "backend/security_layer/retrieval_acl/noop_seam_hook.py"
      - "backend/security_layer/retrieval_acl/enforce_hook.py"
      - "backend/onyx/context/search/pipeline.py"
      - "backend/security_layer/tests/test_retrieval_acl_real_path_shadow_observation.py"
      - "backend/security_layer/tests/test_retrieval_acl_noop_seam_hook.py"
      - "backend/security_layer/tests/test_retrieval_acl_real_search_pipeline_noop_hook.py"
      - "docs/security/evidence/bundle_l_real_path_shadow_observation.md"
      - "docs/security/evidence/step_05_real_path_retrieval_acl_enforcement.md"
      - "docs/security/evidence/step_05_real_path_retrieval_acl_enforcement_summary.md"
      - "docs/security/runbooks/retrieval_acl_real_path_enforcement_runbook.md"
      - ".github/workflows/retrieval-acl-real-path-shadow-observation-tests.yml"
  workflow_dispatch:

jobs:
  retrieval-acl-real-path-shadow-observation-tests:
    name: Real-path shadow observation proof tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: |
          python -m pip install --upgrade pip
          # Minimal dependency for Bundle L tests only.
          # Passing tests do NOT prove live retrieval enforcement, filtering,
          # blocking, production readiness, enterprise readiness, or compliance readiness.
          python -m pip install pytest

      - name: Capture environment metadata
        run: |
          mkdir -p retrieval-acl-real-path-shadow-observation-artifacts
          {
            echo "claim_boundary=real-path shadow observation proof only"
            echo "production_readiness=NO-GO"
            echo "enterprise_readiness=NO-GO"
            echo "live_enforcement_claimed=false"
            echo "live_filtering_claimed=false"
            echo "live_blocking_claimed=false"
            echo "feature_flag=ONYX_SECURITY_RETRIEVAL_ACL_MODE"
            echo "shadow_behavior=observe_only_preserve_chunks"
            echo "python_version=$(python --version)"
            echo "pytest_version=$(python -m pytest --version)"
            echo "test_command=PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_real_path_shadow_observation.py backend/security_layer/tests/test_retrieval_acl_noop_seam_hook.py backend/security_layer/tests/test_retrieval_acl_real_search_pipeline_noop_hook.py backend/security_layer/tests/test_retrieval_acl_enforce_hook.py -q"
          } > retrieval-acl-real-path-shadow-observation-artifacts/environment_metadata.txt

      - name: Run focused retrieval ACL real-path shadow observation tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest \
            backend/security_layer/tests/test_retrieval_acl_real_path_shadow_observation.py \
            backend/security_layer/tests/test_retrieval_acl_noop_seam_hook.py \
            backend/security_layer/tests/test_retrieval_acl_real_search_pipeline_noop_hook.py \
            backend/security_layer/tests/test_retrieval_acl_enforce_hook.py \
            -q 2>&1 | tee retrieval-acl-real-path-shadow-observation-artifacts/test.log

      - name: Upload retrieval ACL real-path shadow observation evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-acl-real-path-shadow-observation-test-evidence
          path: retrieval-acl-real-path-shadow-observation-artifacts/
