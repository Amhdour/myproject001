name: Retrieval ACL Shadow Observation Runbook Verification Tests

on:
  pull_request:
    paths:
      - "docs/security/runbooks/retrieval_acl_shadow_observation_non_production.md"
      - "backend/security_layer/tests/test_retrieval_acl_shadow_observation_runbook.py"
      - ".github/workflows/retrieval-acl-shadow-observation-runbook-tests.yml"
  workflow_dispatch:

jobs:
  retrieval-acl-shadow-observation-runbook-tests:
    name: Shadow observation runbook verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run shadow observation runbook verification tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest \
            backend/security_layer/tests/test_retrieval_acl_shadow_observation_runbook.py -q 2>&1 | tee retrieval-acl-shadow-observation-runbook-artifacts/test.log

      - name: Upload shadow observation runbook evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-acl-shadow-observation-runbook-test-evidence
          path: retrieval-acl-shadow-observation-runbook-artifacts/