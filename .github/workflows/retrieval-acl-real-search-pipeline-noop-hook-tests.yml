name: Retrieval ACL Real Search Pipeline No-Op Hook Tests

on:
  pull_request:
    paths:
      - "backend/onyx/context/search/pipeline.py"
      - "backend/security_layer/retrieval_acl/noop_seam_hook.py"
      - "backend/security_layer/tests/test_retrieval_acl_real_search_pipeline_noop_hook.py"
      - "backend/security_layer/tests/test_retrieval_acl_noop_seam_hook.py"
      - "docs/security/evidence/bundle_k_real_search_pipeline_noop_hook.md"
      - ".github/workflows/retrieval-acl-real-search-pipeline-noop-hook-tests.yml"
  workflow_dispatch:

jobs:
  retrieval-acl-real-search-pipeline-noop-hook-tests:
    name: Real search_pipeline no-op hook patch proof tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: |
          python -m pip install --upgrade pip
          # Minimal dependency for Bundle K tests only.
          # Passing tests do NOT prove live retrieval enforcement, filtering,
          # blocking, production readiness, enterprise readiness, or compliance readiness.
          python -m pip install pytest

      - name: Capture environment metadata
        run: |
          mkdir -p retrieval-acl-real-search-pipeline-noop-hook-artifacts
          {
            echo "claim_boundary=real search_pipeline no-op hook patch proof only"
            echo "production_readiness=NO-GO"
            echo "enterprise_readiness=NO-GO"
            echo "live_enforcement_claimed=false"
            echo "live_filtering_claimed=false"
            echo "live_blocking_claimed=false"
            echo "patched_file=backend/onyx/context/search/pipeline.py"
            echo "patched_return=return apply_retrieval_acl_search_pipeline_noop_hook(chunks=censored_chunks)"
            echo "python_version=$(python --version)"
            echo "pytest_version=$(python -m pytest --version)"
            echo "test_command=PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_real_search_pipeline_noop_hook.py backend/security_layer/tests/test_retrieval_acl_noop_seam_hook.py -q"
          } > retrieval-acl-real-search-pipeline-noop-hook-artifacts/environment_metadata.txt

      - name: Run focused retrieval ACL real search pipeline no-op hook tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest \
            backend/security_layer/tests/test_retrieval_acl_real_search_pipeline_noop_hook.py \
            backend/security_layer/tests/test_retrieval_acl_noop_seam_hook.py \
            -q 2>&1 | tee retrieval-acl-real-search-pipeline-noop-hook-artifacts/test.log

      - name: Upload retrieval ACL real search pipeline no-op hook evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-acl-real-search-pipeline-noop-hook-test-evidence
          path: retrieval-acl-real-search-pipeline-noop-hook-artifacts/
