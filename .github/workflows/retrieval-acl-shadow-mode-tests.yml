name: Retrieval ACL Shadow Mode Tests

on:
  pull_request:
    paths:
      - "backend/security_layer/retrieval_acl/**"
      - "backend/security_layer/tests/test_retrieval_acl_shadow_mode.py"
      - "docs/security/evidence/bundle_a_retrieval_acl_shadow_mode_proof.md"
      - ".github/workflows/retrieval-acl-shadow-mode-tests.yml"
  workflow_dispatch:

jobs:
  retrieval-acl-shadow-mode-tests:
    name: Isolated retrieval ACL shadow-mode proof tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: |
          python -m pip install --upgrade pip
          # Minimal dependency for the isolated Bundle A shadow-mode tests only.
          # Passing tests do NOT prove production readiness, enterprise readiness,
          # live Onyx retrieval enforcement, live blocking, or live filtering.
          python -m pip install pytest

      - name: Capture environment metadata
        run: |
          mkdir -p retrieval-acl-shadow-mode-artifacts
          {
            echo "claim_boundary=isolated shadow-mode proof only"
            echo "production_readiness=NO-GO"
            echo "enterprise_readiness=NO-GO"
            echo "live_enforcement_claimed=false"
            echo "python_version=$(python --version)"
            echo "pytest_version=$(python -m pytest --version)"
            echo "test_command=PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_shadow_mode.py -q"
          } > retrieval-acl-shadow-mode-artifacts/environment_metadata.txt

      - name: Run focused retrieval ACL shadow-mode tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_shadow_mode.py -q \
            2>&1 | tee retrieval-acl-shadow-mode-artifacts/test.log

      - name: Upload retrieval ACL shadow-mode evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-acl-shadow-mode-test-evidence
          path: retrieval-acl-shadow-mode-artifacts/
