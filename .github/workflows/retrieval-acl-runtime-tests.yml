name: Retrieval ACL Runtime Helper Tests

on:
  pull_request:
    paths:
      - "backend/security_layer/retrieval_acl/**"
      - "backend/security_layer/tests/test_retrieval_acl_runtime.py"
      - "docs/security/evidence/step_21_retrieval_acl_runtime_proof.md"
      - ".github/workflows/retrieval-acl-runtime-tests.yml"
  workflow_dispatch:

jobs:
  retrieval-acl-runtime-helper-tests:
    name: Isolated retrieval ACL runtime helper proof tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: |
          python -m pip install --upgrade pip
          # Minimal dependency for the isolated Step 21 helper tests only.
          # Passing tests do NOT prove production readiness, enterprise readiness,
          # or full Onyx live retrieval enforcement.
          python -m pip install pytest

      - name: Capture environment metadata
        run: |
          mkdir -p retrieval-acl-runtime-artifacts
          {
            echo "claim_boundary=isolated runtime helper proof only"
            echo "production_readiness=NO-GO"
            echo "enterprise_readiness=NO-GO"
            echo "python_version=$(python --version)"
            echo "pytest_version=$(python -m pytest --version)"
            echo "test_command=PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_runtime.py -q"
          } > retrieval-acl-runtime-artifacts/environment_metadata.txt

      - name: Run focused retrieval ACL runtime tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_runtime.py -q \
            2>&1 | tee retrieval-acl-runtime-artifacts/test.log

      - name: Upload retrieval ACL runtime evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-acl-runtime-helper-test-evidence
          path: retrieval-acl-runtime-artifacts/
