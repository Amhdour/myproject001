name: Retrieval ACL Telemetry Tests

on:
  pull_request:
    paths:
      - "backend/security_layer/retrieval_acl/**"
      - "backend/security_layer/tests/test_retrieval_acl_telemetry.py"
      - "scripts/portfolio/generate_retrieval_acl_telemetry_evidence.py"
      - "docs/security/evidence/bundle_c_retrieval_acl_audit_telemetry_proof.md"
      - ".github/workflows/retrieval-acl-telemetry-tests.yml"
  workflow_dispatch:

jobs:
  retrieval-acl-telemetry-tests:
    name: Isolated retrieval ACL telemetry proof tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: |
          python -m pip install --upgrade pip
          # Minimal dependency for isolated Bundle C tests only.
          # Passing tests do NOT prove production readiness, enterprise readiness,
          # live Onyx retrieval enforcement, live blocking, or live filtering.
          python -m pip install pytest

      - name: Capture environment metadata
        run: |
          mkdir -p retrieval-acl-telemetry-artifacts
          {
            echo "claim_boundary=isolated telemetry proof only"
            echo "production_readiness=NO-GO"
            echo "enterprise_readiness=NO-GO"
            echo "live_enforcement_claimed=false"
            echo "python_version=$(python --version)"
            echo "pytest_version=$(python -m pytest --version)"
            echo "test_command=PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_telemetry.py -q"
            echo "evidence_command=PYTHONPATH=. python scripts/portfolio/generate_retrieval_acl_telemetry_evidence.py"
          } > retrieval-acl-telemetry-artifacts/environment_metadata.txt

      - name: Run focused retrieval ACL telemetry tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest backend/security_layer/tests/test_retrieval_acl_telemetry.py -q \
            2>&1 | tee retrieval-acl-telemetry-artifacts/test.log

      - name: Generate retrieval ACL telemetry evidence summary
        run: |
          PYTHONPATH=. python scripts/portfolio/generate_retrieval_acl_telemetry_evidence.py

      - name: Upload retrieval ACL telemetry evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-acl-telemetry-test-evidence
          path: retrieval-acl-telemetry-artifacts/
