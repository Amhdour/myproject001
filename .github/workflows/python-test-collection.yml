name: Python Backend Test Collection

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend-unit-collection:
    name: Backend unit test collection
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install repository Python dependencies
        run: uv sync --frozen

      - name: Collect backend unit tests
        run: uv run python -m pytest --collect-only backend/tests/unit -q
